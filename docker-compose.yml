services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    command: sh -lc "composer install && php -S 0.0.0.0:8080 -t public"
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: guard_study
      DB_USERNAME: guard
      DB_PASSWORD: guard
      CORS_ALLOWED_ORIGIN: http://localhost:5173

  mysql:
    image: mysql:8.4
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: guard_study
      MYSQL_USER: guard
      MYSQL_PASSWORD: guard
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
